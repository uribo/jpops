on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: air-format

permissions: read-all

jobs:
  air-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Air
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format R tests --check
